<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" id="favicon" type="image/webp" href="/favicon/1.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Chatzoudas - Portfolio</title>
    <meta
      name="description"
      content="Chatzoudas portfolio showcasing projects, skills, and ways to get in touch."
    />
    <meta name="robots" content="index,follow" />
    <meta name="author" content="Chatzoudas" />
    <meta
      name="keywords"
      content="Chatzoudas, portfolio, web developer, software developer, React, TypeScript, Vite, projects"
    />

    <meta property="og:title" content="Chatzoudas - Portfolio" />
    <meta
      property="og:description"
      content="Projects, skills, and contact information for Chatzoudas."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon/1.webp" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Chatzoudas - Portfolio" />
    <meta
      name="twitter:description"
      content="Projects, skills, and contact information for Chatzoudas."
    />
    <script>
      (async function () {
        const frames = Array.from(
          { length: 10 },
          (_, idx) => `/favicon/${idx + 1}.webp`
        );

        let i = 0;
        let interval;

        const setIcon = (href) => {
          const link = document.getElementById("favicon");
          if (!link) return;
          link.type = "image/webp";
          link.href = href;
        };

        const updateMeta = (href) => {
          const og = document.querySelector('meta[property="og:image"]');
          if (og) og.setAttribute("content", href);
        };

        const updateIcon = () => {
          setIcon(frames[i]);
          updateMeta(frames[i]);
          i = (i + 1) % frames.length;
        };

        const start = () => {
          if (!interval) interval = setInterval(updateIcon, 250);
        };

        const stop = () => {
          clearInterval(interval);
          interval = null;
          i = 0;
          setIcon(frames[0]);
          updateMeta(frames[0]);
        };

        setIcon(frames[0]);
        updateMeta(frames[0]);

        if (!document.hidden) start();

        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            stop();
          } else {
            start();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
